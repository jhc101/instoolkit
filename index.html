<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保險業務實用工具箱</title>
<style>
  body { font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; background:#f5f6fa; margin:0; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  .card { background:#fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  h1 { font-size: 1.1rem; font-weight: 700; margin: 0 0 4px; }
  p.hint { font-size: 0.75rem; color: #888; margin: 0; }
  label { font-size: 0.85rem; color: #555; display:block; margin-top: 10px; }
  label:first-child { margin-top: 0; }
  select, input {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    font-size: 1rem;
    margin-top: 4px;
    -webkit-appearance: none;
    appearance: none;
    display: block;
  }
  input[type="date"], input[type="datetime-local"] {
    min-height: 42px;
  }
  .row { display:flex; gap: 8px; }
  .row > div { flex: 1; min-width: 0; }
  button#calcBtn { width:100%; background:#111; color:#fff; border:none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight:600; margin-top: 16px; }
  button#calcBtn:disabled { background:#999; }
  button#copyBtn { width:100%; border: 1px solid #ddd; background:#fff; border-radius: 8px; padding: 10px; font-size: 0.85rem; margin-top: 10px; }
  .big-result { font-size: 1.8rem; font-weight: 700; }
  .mid-result { font-size: 1.5rem; font-weight: 700; }
  .result-row { display:flex; gap: 16px; flex-wrap: wrap; }
  .result-row > div { flex: 1; min-width: 120px; }
  .result-label { font-size: 0.8rem; color: #888; margin-bottom: 2px; }
  .sub { font-size: 1rem; color: #666; margin-top: 6px; line-height: 1.5; }
  .alert-box { margin-top: 8px; font-size: 0.9rem; padding: 8px; border-radius: 8px; background: #fff8e1; }
  .alert-source { font-size: 0.75rem; color: #999; margin-top: 4px; }
  .error { color: #d33; font-size: 0.85rem; margin-top: 8px; }
  .hidden { display:none; }
  details { margin-top: 12px; font-size: 0.7rem; color: #999; }
  summary { cursor: pointer; }
  pre { background:#f5f5f5; padding: 8px; border-radius: 6px; overflow-x:auto; white-space: pre-wrap; font-size: 0.7rem; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 頂部區塊 -->
  <div class="card">
    <h1>保險業務實用工具箱</h1>
    <p class="hint">本工具不留存任何個資，所有計算即時運算即丟。法規提示僅供參考，不構成法律意見，請以主管機關最新公告為準。</p>
  </div>

  <!-- 核心控制區 -->
  <div class="card">
    <label>選擇工具</label>
    <select id="moduleSelect">
      <option value="insuranceAge">保險年齡計算</option>
      <option value="travelInsurance">旅平險天數試算</option>
      <option value="adultBMI">成人 BMI</option>
      <option value="childBMI">兒少 BMI</option>
      <option value="policyIRR">保單 IRR 試算</option>
      <option value="retirementPlanning">退休金規劃試算</option>
    </select>
  </div>

  <!-- 動態輸入區 -->
  <div class="card" id="inputCard">
    <div id="inputArea"></div>
    <button id="calcBtn">計算</button>
    <p id="errorMsg" class="error hidden"></p>
  </div>

  <!-- 結果輸出區 -->
  <div id="resultArea" class="card hidden">
    <div id="resultBody"></div>
    <button id="copyBtn">一鍵複製</button>
  </div>

</div>

<script>
// GAS 部署後的 /exec 網址，兩邊部署方式共用同一份程式碼：
// - GitHub Pages：務必填入實際的 GAS /exec 網址（Apps Script 部署 > 新增部署作業 > 網頁應用程式）
// - GAS HtmlService 內開啟（doGet 無參數時直接回傳本頁面）：與本頁同源，此常數一樣有效，不需另外處理
const API_URL = 'https://script.google.com/macros/s/AKfycbxDpojGT76F5mc_vtnuI9tltvp7Sl1ItCLiJIK-FhIaa9_Y9FBSrqmTHpfVqz8VJieycg/exec'; // TODO: 替換成實際的 GAS /exec 部署網址

const templates = {
  insuranceAge: `
    <label>出生日期 <span style="color:#d33">*</span></label>
    <input type="date" id="f_birthDate" required>
    <label>預計投保日期</label>
    <input type="date" id="f_effectiveDate">
  `,
  travelInsurance: `
    <label>出發時間（集合/交通工具出發時間）</label>
    <input type="datetime-local" id="f_departure">
    <label>抵達時間（解散/交通工具到達時間）</label>
    <input type="datetime-local" id="f_arrival">
    <div class="row">
      <div>
        <label>出發前緩衝(hr)</label>
        <input type="number" id="f_beforeBuffer" value="3" inputmode="decimal" pattern="[0-9]*">
      </div>
      <div>
        <label>抵達後緩衝(hr)</label>
        <input type="number" id="f_afterBuffer" value="3" inputmode="decimal" pattern="[0-9]*">
      </div>
    </div>
  `,
  adultBMI: `
    <label>身高 (cm)</label>
    <input type="number" id="f_height" inputmode="decimal" step="0.1">
    <label>體重 (kg)</label>
    <input type="number" id="f_weight" inputmode="decimal" step="0.1">
  `,
  childBMI: `
    <label>出生日期 <span style="color:#d33">*</span></label>
    <input type="date" id="f_birthDate" required>
    <label>預計投保日期（留空預設今天）</label>
    <input type="date" id="f_effectiveDate">
    <label>性別</label>
    <select id="f_gender">
      <option value="M">男</option>
      <option value="F">女</option>
    </select>
    <label>身高 (cm)（選填，不知道可留空）</label>
    <input type="number" id="f_height" inputmode="decimal" step="0.1">
    <label>體重 (kg)（選填，不知道可留空）</label>
    <input type="number" id="f_weight" inputmode="decimal" step="0.1">
  `,
  policyIRR: `
    <label>年繳保費（實際繳費金額）</label>
    <input type="number" id="f_premium" inputmode="decimal" step="1">
    <label>繳費年期（1-30 年，依各保險公司商品設計）</label>
    <input type="number" id="f_payYears" inputmode="numeric" step="1" min="1" max="30">
    <label>保單生效日（契約成立日） <span style="color:#d33">*</span></label>
    <input type="date" id="f_policyEffectiveDate" required>
    <label>解約金查詢日 <span style="color:#d33">*</span></label>
    <input type="date" id="f_queryDate" required>
    <label>該日解約金金額</label>
    <input type="number" id="f_cashValue" inputmode="decimal" step="1">
  `,
  retirementPlanning: `
    <label>退休生活型態</label>
    <select id="f_lifestyle">
      <option value="luxury">隨心所欲，年年出國（年約72萬）</option>
      <option value="moderate">平安自在，含飴弄孫（年約48萬）</option>
      <option value="simple">簡簡單單，休養生息（年約24萬）</option>
      <option value="custom">自訂金額</option>
    </select>
    <div id="customCostWrap" class="hidden">
      <label>年生活費（元）</label>
      <input type="number" id="f_customAnnualCost" inputmode="numeric" step="1">
    </div>
    <label>目前年紀</label>
    <input type="number" id="f_currentAge" inputmode="numeric" step="1">
    <label>預計退休年齡</label>
    <input type="number" id="f_retireAge" inputmode="numeric" step="1">
    <label>自訂投資報酬率 (%)（選填，不填則只比較抽屜與銀行1%定存）</label>
    <input type="number" id="f_customRate" inputmode="decimal" step="0.1">
    <label>每月可投資金額（選填，填寫後會額外反推所需報酬率）</label>
    <input type="number" id="f_monthlyInvest" inputmode="numeric" step="1">
  `
};

const moduleSelect = document.getElementById('moduleSelect');
const inputArea = document.getElementById('inputArea');
const resultArea = document.getElementById('resultArea');
const resultBody = document.getElementById('resultBody');
const errorMsg = document.getElementById('errorMsg');
const calcBtn = document.getElementById('calcBtn');
let lastCopyText = '';

function renderInputs() {
  inputArea.innerHTML = templates[moduleSelect.value];
  resultArea.classList.add('hidden');
  errorMsg.classList.add('hidden');

  // 預計投保日期／解約金查詢日預設帶入今天，方便測試時直接調整（出生日期/保單生效日不預設，避免誤導）
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const todayStr = `${yyyy}-${mm}-${dd}`;

  const effectiveInput = document.getElementById('f_effectiveDate');
  if (effectiveInput) {
    effectiveInput.value = todayStr;
  }
  const queryDateInput = document.getElementById('f_queryDate');
  if (queryDateInput) {
    queryDateInput.value = todayStr;
  }

  const lifestyleSelect = document.getElementById('f_lifestyle');
  const customCostWrap = document.getElementById('customCostWrap');
  if (lifestyleSelect && customCostWrap) {
    lifestyleSelect.addEventListener('change', () => {
      customCostWrap.classList.toggle('hidden', lifestyleSelect.value !== 'custom');
    });
  }
}
moduleSelect.addEventListener('change', renderInputs);
renderInputs();

function buildPayload() {
  const m = moduleSelect.value;
  if (m === 'insuranceAge') {
    return { module: m, data: {
      birthDate: document.getElementById('f_birthDate').value,
      effectiveDate: document.getElementById('f_effectiveDate').value || undefined
    }};
  }
  if (m === 'travelInsurance') {
    return { module: m, data: {
      departureDateTime: document.getElementById('f_departure').value,
      arrivalDateTime: document.getElementById('f_arrival').value,
      beforeBufferHours: Number(document.getElementById('f_beforeBuffer').value),
      afterBufferHours: Number(document.getElementById('f_afterBuffer').value)
    }};
  }
  if (m === 'adultBMI') {
    return { module: m, data: {
      heightCm: Number(document.getElementById('f_height').value),
      weightKg: Number(document.getElementById('f_weight').value)
    }};
  }
  if (m === 'childBMI') {
    const heightVal = document.getElementById('f_height').value;
    const weightVal = document.getElementById('f_weight').value;
    return { module: m, data: {
      birthDate: document.getElementById('f_birthDate').value,
      effectiveDate: document.getElementById('f_effectiveDate').value || undefined,
      gender: document.getElementById('f_gender').value,
      heightCm: heightVal ? Number(heightVal) : undefined,
      weightKg: weightVal ? Number(weightVal) : undefined
    }};
  }
  if (m === 'policyIRR') {
    return { module: m, data: {
      annualPremium: Number(document.getElementById('f_premium').value),
      payYears: Number(document.getElementById('f_payYears').value),
      policyEffectiveDate: document.getElementById('f_policyEffectiveDate').value,
      queryDate: document.getElementById('f_queryDate').value,
      cashValue: Number(document.getElementById('f_cashValue').value)
    }};
  }
  if (m === 'retirementPlanning') {
    const customRateVal = document.getElementById('f_customRate').value;
    const monthlyInvestVal = document.getElementById('f_monthlyInvest').value;
    return { module: m, data: {
      lifestyle: document.getElementById('f_lifestyle').value,
      customAnnualCost: document.getElementById('f_lifestyle').value === 'custom'
        ? Number(document.getElementById('f_customAnnualCost').value) : undefined,
      currentAge: Number(document.getElementById('f_currentAge').value),
      retireAge: Number(document.getElementById('f_retireAge').value),
      customRate: customRateVal || undefined,
      monthlyInvest: monthlyInvestVal || undefined
    }};
  }
}

function renderResult(module, result) {
  let html = '';
  if (module === 'insuranceAge') {
    html = `<div class="big-result">保險年齡 ${result.insuranceAge} 歲</div>
      <p class="sub">足歲 ${result.actualAge} 歲・下次換歲 ${result.nextBumpDate}（倒數 ${result.countdownDays} 天）</p>
      ${result.alerts.map(a => `<div class="alert-box">${a.text}<div class="alert-source">法源：${a.source}</div></div>`).join('')}`;
  } else if (module === 'travelInsurance') {
    html = `<div class="big-result">${result.totalDays} 天</div>
      <p class="sub">起：${result.suggestedStart}　迄：${result.suggestedEnd}（完整 ${result.totalDays} 天涵蓋）</p>
      <p class="sub">實際需求涵蓋至：${result.neededEnd}</p>`;
  } else if (module === 'adultBMI') {
    html = `<div class="big-result">${result.bmi}</div>
      <p class="sub">分類：${result.category}（法源：${result.source}）</p>
      <p class="sub">該身高健康體重範圍：${result.healthyWeightMin} - ${result.healthyWeightMax} kg</p>`;
  } else if (module === 'childBMI') {
    if (result.routedTo === 'adultBMI') {
      html = `<p class="sub">${result.message}</p>`;
      if (result.adultBMIResult) {
        html += `<div class="big-result">${result.adultBMIResult.bmi}</div>
          <p class="sub">分類：${result.adultBMIResult.category}</p>
          <p class="sub">健康體重範圍：${result.adultBMIResult.healthyWeightMin} - ${result.adultBMIResult.healthyWeightMax} kg</p>`;
      }
    } else {
      html = `<div class="result-row">
          <div>
            <div class="result-label">身高參考範圍 (cm)</div>
            <div class="mid-result">${result.heightRangeCm.min} - ${result.heightRangeCm.max}</div>
          </div>
          <div>
            <div class="result-label">體重參考範圍 (kg)</div>
            <div class="mid-result">${result.weightRangeKg.min} - ${result.weightRangeKg.max}</div>
          </div>
        </div>
        <p class="sub">對照約 ${result.matchedAgeMonths} 月齡（保險年齡 ${result.insuranceAge} 歲）</p>`;
      if (result.bmi !== undefined) {
        html += `<div class="alert-box">
          <div class="result-label">輸入身高體重之 BMI</div>
          <div class="mid-result">${result.bmi}　${result.bmiCategory}</div>
          <div class="alert-source">法源：${result.bmiSource}</div></div>`;
      }
      html += `<p class="alert-source">${result.disclaimer}</p>`;
    }
  } else if (module === 'policyIRR') {
    if (result.irrSolved === false) {
      html = `<p class="sub">${result.message}</p>`;
    } else {
      html = `<div class="big-result">IRR ${result.irrPercent}%</div>
        <p class="sub">經過 ${result.elapsedExactYears} 年（已繳 ${result.premiumsPaid} 次保費，共 ${result.totalPremiumPaid.toLocaleString()} 元）・查詢日解約金：${result.cashValue.toLocaleString()} 元</p>`;
    }
    html += `<div class="alert-box">${result.leverageNote}<div class="alert-source">試算說明</div></div>
      <div class="alert-box">${result.precisionNote}<div class="alert-source">試算說明</div></div>`;
  } else if (module === 'retirementPlanning') {
    html = `<div class="big-result">NT$ ${result.targetTotal.toLocaleString()}</div>
      <p class="sub">退休後生活 ${result.yearsInRetirement} 年（${result.retireAge}歲→85歲）・${result.lifestyleLabel}（年 ${result.annualLivingCost.toLocaleString()} 元）</p>
      <div class="result-row">
        <div>
          <div class="result-label">抽屜存錢（每年）</div>
          <div class="mid-result">${result.pmtDrawer.toLocaleString()}</div>
        </div>
        <div>
          <div class="result-label">銀行1%定存（每年）</div>
          <div class="mid-result">${result.pmtBank1Percent.toLocaleString()}</div>
        </div>`;
    if (result.pmtCustomRate !== undefined) {
      html += `<div>
          <div class="result-label">自訂 ${result.customRatePercent}%（每年）</div>
          <div class="mid-result">${result.pmtCustomRate.toLocaleString()}</div>
        </div>`;
    }
    html += `</div>`;
    if (result.requiredRateResult) {
      const monthlyStr = result.monthlyInvest.toLocaleString();
      const annualStr = result.annualInvest.toLocaleString();
      html += `<div style="margin-top:16px;padding-top:16px;border-top:1px solid #eee;">
        <div class="result-label">每月投入 NT$${monthlyStr}（年投入 NT$${annualStr}）</div>`;
      if (result.requiredRateResult.rateSufficientAtZero) {
        html += `<div class="big-result">免額外報酬率</div>
          <p class="sub">不需額外投資報酬率即可達成目標</p>`;
      } else if (result.requiredRateResult.solved) {
        html += `<div class="big-result">${result.requiredRatePercent}%</div>
          <p class="sub">所需年化報酬率，方可達成退休金目標</p>`;
      } else {
        html += `<div class="big-result">無解</div>
          <p class="sub">即使報酬率達500%仍無法達成目標，建議提高月投入或延後退休年齡</p>`;
      }
      html += `</div>`;
    }
    html += `<div class="alert-box">${result.assumptionNote}<div class="alert-source">試算說明</div></div>`;
  }
  resultBody.innerHTML = html;
  lastCopyText = result.copyText || '';
  resultArea.classList.remove('hidden');
}

function handleSuccess(response) {
  calcBtn.disabled = false;
  calcBtn.textContent = '計算';
  if (!response.ok) {
    errorMsg.textContent = '計算失敗：' + response.error;
    errorMsg.classList.remove('hidden');
    resultArea.classList.add('hidden');
    return;
  }
  renderResult(response.module, response.result);
}

function handleFailure(error) {
  calcBtn.disabled = false;
  calcBtn.textContent = '計算';
  errorMsg.textContent = '呼叫失敗：' + (error.message || error);
  errorMsg.classList.remove('hidden');
  resultArea.classList.add('hidden');
}

calcBtn.addEventListener('click', () => {
  errorMsg.classList.add('hidden');

  // 出生日期為模組一、四之必填欄位
  const birthDateInput = document.getElementById('f_birthDate');
  if (birthDateInput && !birthDateInput.value) {
    errorMsg.textContent = '請填寫出生日期';
    errorMsg.classList.remove('hidden');
    resultArea.classList.add('hidden');
    return;
  }

  // 模組五：保費、繳費年期、保單生效日、解約金查詢日、解約金皆為必填
  if (moduleSelect.value === 'policyIRR') {
    const premiumVal = document.getElementById('f_premium').value;
    const payYearsVal = document.getElementById('f_payYears').value;
    const effDateVal = document.getElementById('f_policyEffectiveDate').value;
    const queryDateVal = document.getElementById('f_queryDate').value;
    const cashValueVal = document.getElementById('f_cashValue').value;
    if (!premiumVal || !payYearsVal || !effDateVal || !queryDateVal || !cashValueVal) {
      errorMsg.textContent = '請完整填寫年繳保費、繳費年期、保單生效日、解約金查詢日與解約金';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
    if (Number(payYearsVal) < 1 || Number(payYearsVal) > 30) {
      errorMsg.textContent = '繳費年期請輸入 1-30 之間的整數';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
    if (new Date(queryDateVal) <= new Date(effDateVal)) {
      errorMsg.textContent = '解約金查詢日須晚於保單生效日';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
  }

  // 模組六：目前年紀、預計退休年齡皆為必填，退休年齡須大於目前年紀
  if (moduleSelect.value === 'retirementPlanning') {
    const currentAgeVal = document.getElementById('f_currentAge').value;
    const retireAgeVal = document.getElementById('f_retireAge').value;
    if (!currentAgeVal || !retireAgeVal) {
      errorMsg.textContent = '請填寫目前年紀與預計退休年齡';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
    if (Number(retireAgeVal) <= Number(currentAgeVal)) {
      errorMsg.textContent = '預計退休年齡須大於目前年紀';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
    if (document.getElementById('f_lifestyle').value === 'custom' && !document.getElementById('f_customAnnualCost').value) {
      errorMsg.textContent = '選擇自訂金額時，請填寫年生活費';
      errorMsg.classList.remove('hidden');
      resultArea.classList.add('hidden');
      return;
    }
  }

  calcBtn.disabled = true;
  calcBtn.textContent = '計算中…';
  const payload = buildPayload();
  // 改用 fetch 呼叫 GAS /exec 網址，Content-Type 用 text/plain 以避開 CORS preflight
  // （瀏覽器對 text/plain 的 POST 視為「簡單請求」，不會先發 OPTIONS 預檢，GAS 亦不需額外處理 CORS 標頭）
  // GitHub Pages 與 GAS HtmlService 內開啟兩種情境皆適用同一套呼叫方式
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(handleSuccess)
    .catch(handleFailure);
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(lastCopyText);
  const btn = document.getElementById('copyBtn');
  const orig = btn.textContent;
  btn.textContent = '已複製 ✓';
  setTimeout(() => btn.textContent = orig, 1200);
});
</script>
</body>
</html>
